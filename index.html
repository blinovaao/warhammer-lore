<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Главная страница</title>
    <link rel="icon" type="image/png" href="/warhammer-lore/assets/favicon-96x96-BuXDAP7-.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/warhammer-lore/assets/favicon-C_7YEVgK.svg" />
    <link rel="shortcut icon" href="/warhammer-lore/assets/favicon-D73FxpAi.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/warhammer-lore/assets/apple-touch-icon-DxqxnCmN.png" />
    <meta name="apple-mobile-web-app-title" content="WH40000" />
    <link rel="preload" href="/warhammer-lore/assets/OpenSans-Regular-N6ipOEWl.woff2" type="font/woff2" as="font" crossorigin="anonymous">
    <link rel="preload" href="/warhammer-lore/assets/BebasNeueRegular-D00apsXq.woff2" type="font/woff2" as="font" crossorigin="anonymous">
    <link rel="preload" href="/warhammer-lore/assets/Tektur-Regular--zcwFzyt.woff2" type="font/woff2" as="font" crossorigin="anonymous">
    
    <link rel="manifest" href="/warhammer-lore/assets/site-DOavtQLW.webmanifest" />
    <script type="module" crossorigin src="/warhammer-lore/assets/index-LIy3uBaR.js"></script>
    <link rel="stylesheet" crossorigin href="/warhammer-lore/assets/index-WiSvkNaj.css">
  </head>
  <body>
    <header class="main-header">
      <div class="main-header__wrapper">
        <a class="main-header__logo" href="index.html" aria-current="true">
          <picture>
            <source media="(min-width: 768px)" srcset="/warhammer-lore/assets/logo-BCkvvOT0.svg" width="150">
            <img src="/warhammer-lore/assets/logo-BCkvvOT0.svg" width="100" alt="Логотип Вселенной Warhammer.">
          </picture>
        </a>

        <nav class="main-header__navigation main-nav">
          <button class="main-nav__button" type="button">
            <span class="visually-hidden">Открыть меню.</span>
          </button>

          <div class="main-nav__inner">
            <ul class="main-nav__list">
              <li class="main-nav__item">
                <a class="main-nav__link" href="#">Примархи</a>
              </li>
              <li class="main-nav__item">
                <a class="main-nav__link" href="#">Легионы</a>
              </li>
            </ul>
          </div >
        </nav>
      </div>

    </header>

    <main>
      <h1 class="visually-hidden">Вселенная Warhammer 40000: Персонажи и Легионы.</h1>

      <section class="hero">
        <div class="hero__wrapper">
          <div class="hero__slider hero-slider">
            <ul class="hero-slider__list">
              <li class="hero-slider__item hero-slide hero-slide--active">
                <img class="hero-slide__image" src="/warhammer-lore/assets/hero-1-CEPI5D7D.jpg" alt="">
              </li>
              <li class="hero-slider__item hero-slide">
                <img class="hero-slide__image" src="/warhammer-lore/assets/hero-2-C67TW_XY.jpg" alt="">
              </li>
              <li class="hero-slider__item hero-slide">
                <img class="hero-slide__image" src="/warhammer-lore/assets/hero-3-BJZUKnmj.jpg" alt="">
              </li>
              <li class="hero-slider__item hero-slide">
                <img class="hero-slide__image" src="/warhammer-lore/assets/hero-4-BEE4hREG.jpg" alt="">
              </li>
            </ul>
          </div>

          <div class="hero__inner">
            <h2 class="hero__title">Добро пожаловать в&nbsp;Империум Человечества!</h2>
            <p class="hero__text">Ты вступил в&nbsp;мир, где нет пощады. Здесь миллиарды жизней приносятся во&nbsp;имя Императора, а сама Галактика стонет под&nbsp;грохотом Вечной Войны.</p>
          </div>

        </div>
      </section>

      <section class="characters">
        <div class="characters__wrapper">
          <h2 class="visually-hidden">Персонажи Империума.</h2>

          <div class="characters__inner wh-persons">
            <div class="wh-persons--emperor">
              <div class="wh-person wh-person--emperor"></div>
            </div>

            <div class="wh-persons--loyal">
              <ul class="wh-persons__list wh-persons__list--loyal">

              </ul>
            </div>

            <div class="wh-persons--fallen">
              <ul class="wh-persons__list wh-persons__list--fallen">

              </ul>
            </div>
          </div>
        </div>
      </section>

    </main>

    <footer></footer>

    <!-- Шаблон карточки персонажа -->
    <template id="character">
      <img class="wh-person__image" src="" alt="">
      <div class="wh-person__inner">
        <a class="wh-person__link">
          <h3 class="wh-person__name"></h3>
        </a>
        <p class="wh-person__description"></p>
      </div>
    </template>

  </body>
</html>
